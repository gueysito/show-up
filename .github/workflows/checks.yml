name: Local foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOWUP_ENV: test
      DATABASE_URL: postgresql://showup@127.0.0.1:55433/showup_test
      NEXT_TELEMETRY_DISABLED: "1"
      SHOWUP_CONTAINER_E2E: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run supply-chain:check
      - run: npm run check
      - run: docker compose --profile checks up -d --wait test-db
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: docker compose --profile harness up --build -d --wait harness worker
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: docker compose --profile checks --profile harness down
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run contracts:prepare
      - run: npm run contracts:check
      - run: docker compose --profile checks up -d --wait test-db
      - run: npm run contracts:app-bridge
        env:
          SHOWUP_ENV: test
          DATABASE_URL: postgresql://showup@127.0.0.1:55433/showup_test
      - if: always()
        run: docker compose --profile checks down
