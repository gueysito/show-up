edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["unstable"] }
bs58 = "=0.5.1"
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }
