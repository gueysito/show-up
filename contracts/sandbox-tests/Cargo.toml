[package]
name = "showup-sandbox-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
near-workspaces = { version = "=0.23.0", default-features = false, features = ["native-tls"] }
near-sandbox = { version = "=0.3.16", features = ["generate"] }
serde_json.workspace = true
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"

# Keep reqwest's matching browser-only packages behind the seven-day release gate.
# They are resolved in Cargo.lock but are not compiled into the Linux test runner.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "=0.3.106"
wasm-bindgen-futures = "=0.4.79"
