[workspace]
resolver = "3"
members = ["showup", "showup-v1", "test-token", "sandbox-tests"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
near-sdk = { version = "=5.29.1", default-features = false }
serde_json = "=1.0.145"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.release.package.showup-v1]
strip = "symbols"
